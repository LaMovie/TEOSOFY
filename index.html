<style>
body {
    width: 100%;
    position: fixed;
    background: #000;
}
.Contenedor {
    gap: 20px;
    width: 90%;
    height: 50vh;
    display: grid;
    overflow-y: auto;
    margin-left: -3vh;
    grid-template-columns: repeat(3, 1fr);    
    list-style: none;    
}
.Contenedor img {
    width: 100%;
    height: 80%;
    background: orange;
    transition: 1.5s;
    border-radius: 20px;
    cursor: pointer;
  &:hover {
      scale: 130%;
      transition: .2s linear;
      border: 2px solid #4f9;
      box-shadow: 0 0 30px #4f9;
  }
}
#Pantalla {
    scale: 95%;
    height: 35vh;
    margin-left: -2vh;
    border-radius: 20px;
}
#Modal {
    top: 0;
    left: 0;
    width: 100%;  
    height: 100%;
    display: none;
    z-index: 9999;
    overflow: auto;
    position: fixed;
    background: rgba(0,0,0,0.5);
}
.alerta {
    top: 15%;
    width: 80%;
    opacity: .8;
    padding: 20px;
    background: rgba(0,0,0,0.9);
    margin: 15% auto;
    position: relative;
    border-radius: 20px;
    border: 1px solid #888;
    box-shadow: 10px 10px 0 #000;
}
.cerrar {
    color: gray;
    float: right;
    font-size: 30px;
    font-weight: bold;
    cursor: none;
  &:hover {
      color: red;
  }
}
@keyframes Sesion {
    0% {opacity: 0;}
    100% {opacity: 1;}
}
@keyframes Desfaz {
    0% {transform: translate(0, 0vh); background: transparent; opacity: 1;}
    99% {transform: translate(0, 5vh); background: transparent;}
    100% {display: none; background: transparent; opacity: 0;}
}
.alerta a {
    color: blue;
    display: none;
    padding: 8px;
    cursor: none;
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
  &:hover {
      color: red;
  }
}
#TITULO {
    color: red;
    font-weight: bold;
}
#Enlace {
    width: 80%;
    height: 6vh;
    color: gold;
    font-size: 15px;
    margin-top: 2vh;
    margin-left: -3vh;
    font-weight: bold;
    border-radius: 20px;
    background: purple;  
    cursor: pointer;
  &:hover {
      color: #4f3;
  }  
}
.puff-in-hor {
    -webkit-animation: puff-in-hor 1s cubic-bezier(0.470, 0.000, 0.745, 0.715) both;
    animation: puff-in-hor 1s cubic-bezier(0.470, 0.000, 0.745, 0.715) both;
}
@-webkit-keyframes puff-in-hor {
    0% {
        -webkit-transform: scaleX(2);
        transform: scaleX(2);
        -webkit-filter: blur(4px);
        filter: blur(4px);
        opacity: 0;
    }
    100% {
        -webkit-transform: scaleX(1);
        transform: scaleX(1);
        -webkit-filter: blur(0px);
        filter: blur(0px);
        opacity: 1;
    }
}
@keyframes puff-in-hor {
    0% {
        transform: scaleX(2);
        filter: blur(4px);
        opacity: 0;
    }
    100% {
        transform: scaleX(1);
        filter: blur(0px);
        opacity: 1;
    }
}
</style>
